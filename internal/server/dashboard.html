<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkBuddy2API 面板</title>
<style>
  :root{
    --bg:#0f1115;--card:#181b22;--line:#262b36;--txt:#e6e9ef;--muted:#8b93a7;
    --green:#3fb950;--yellow:#d29922;--red:#f85149;--blue:#58a6ff;--accent:#7c5cff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;background:rgba(15,17,21,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;z-index:10}
  header h1{font-size:16px;margin:0;font-weight:600}
  header h1 span{color:var(--accent)}
  .key{display:flex;gap:8px;align-items:center;margin-left:auto}
  .key input{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;width:240px;outline:none}
  .key input:focus{border-color:var(--accent)}
  button{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  main{max-width:1080px;margin:0 auto;padding:20px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .card .v{font-size:26px;font-weight:700;line-height:1.1}
  .card .l{color:var(--muted);font-size:12px;margin-top:4px}
  .card.green .v{color:var(--green)} .card.yellow .v{color:var(--yellow)}
  .card.red .v{color:var(--red)} .card.blue .v{color:var(--blue)}
  section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px}
  section h2{font-size:14px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  section h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;white-space:nowrap}
  td.k{color:var(--muted);white-space:nowrap;width:1%}
  .badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line)}
  .badge.healthy{color:var(--green);border-color:var(--green)}
  .badge.cooling{color:var(--yellow);border-color:var(--yellow)}
  .badge.disabled{color:var(--red);border-color:var(--red)}
  .pill{display:inline-block;background:#0d1117;border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin:3px 4px 0 0;font-size:12px}
  .empty{color:var(--muted);font-size:13px;padding:6px 0}
  .err{color:var(--red);font-size:13px}
  .muted{color:var(--muted)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  code{background:#0d1117;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>WorkBuddy<span>2API</span> 面板</h1>
  <div class="key">
    <input id="apikey" type="password" placeholder="在此粘贴 config.json 的 api_key" autocomplete="off">
    <button id="saveKey">保存</button>
    <button id="refresh">刷新</button>
    <label class="muted" style="display:flex;gap:5px;align-items:center;cursor:pointer">
      <input id="auto" type="checkbox" checked> 自动(10s)
    </label>
  </div>
</header>
<main>
  <div class="cards" id="cards"></div>

  <section>
    <h2><span class="dot" style="background:var(--accent)"></span>登录 WorkBuddy 账号（支持多账号）</h2>
    <div class="row">
      <button id="loginBtn" class="primary">＋ 登录 / 添加账号</button>
      <span class="muted">每次登录一个账号，可反复点击添加多个；同 uid 重复登录会覆盖更新凭证。</span>
    </div>
    <div id="loginBox" style="margin-top:12px;display:none">
      <div>1. 在新标签页打开 <a id="loginUrl" target="_blank" rel="noopener" style="color:var(--blue);word-break:break-all"></a></div>
      <div style="margin-top:6px">2. 在该页面完成登录，这里会自动检测并保存：<span id="loginStatus" class="muted">等待登录…</span></div>
    </div>
  </section>

  <section>
    <h2><span class="dot" style="background:var(--yellow)"></span>每日签到</h2>
    <div class="row">
      <button id="checkinBtn" class="primary">立即全量签到</button>
      <span id="scheduleInfo" class="muted">加载中…</span>
    </div>
    <div id="checkinResult" style="margin-top:12px"></div>
  </section>

  <section>
    <h2><span class="dot" style="background:var(--blue)"></span>账号状态（/status）</h2>
    <div id="accounts"></div>
  </section>

  <section>
    <h2><span class="dot" style="background:var(--green)"></span>可用模型（/v1/models）</h2>
    <div id="models"></div>
  </section>

  <section>
    <h2><span class="dot"></span>原始 /status JSON</h2>
    <pre id="raw" class="muted" style="white-space:pre-wrap;word-break:break-word;margin:0"></pre>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
let timer = null;

function getKey(){
  return $('#apikey').value.trim() || localStorage.getItem('wb2api_key') || '';
}
function setKey(k){
  $('#apikey').value = k;
  localStorage.setItem('wb2api_key', k);
}
function authHeaders(){
  const k = getKey();
  return k ? {'Authorization':'Bearer '+k} : {};
}
function errText(e){
  if(e && e.error && e.error.message) return e.error.message;
  if(e && e.text) return e.text;
  if(e && e.message) return e.message;
  return String(e);
}
async function getJSON(url){
  const r = await fetch(url, {headers:authHeaders()});
  if(!r.ok) throw {status:r.status, text:await r.text()};
  return r.json();
}

function card(cls, v, l){
  return `<div class="card ${cls}"><div class="v">${v}</div><div class="l">${l}</div></div>`;
}

function renderCards(s, hz){
  const cards = [];
  cards.push(card('green', s.healthy ?? '-', '健康账号'));
  cards.push(card('blue', s.total ?? '-', '总账号'));
  cards.push(card('yellow', s.cooling ?? 0, '冷却中'));
  cards.push(card('red', s.disabled ?? 0, '已禁用'));
  cards.push(card('', s.sticky_sessions ?? 0, '粘性会话'));
  cards.push(card(hz===200?'green':'red', hz===200?'OK':'503', '健康检查 /healthz'));
  $('#cards').innerHTML = cards.join('');
}

function statusBadge(st){
  const map = {healthy:'healthy',cooling:'cooling',disabled:'disabled'};
  const c = map[st]||'';
  return `<span class="badge ${c}">${st||'?'}</span>`;
}

function renderAccounts(s){
  const accs = Array.isArray(s.accounts) ? s.accounts : [];
  if(accs.length===0){
    $('#accounts').innerHTML = `<div class="empty">暂无账号。点击上方「＋ 登录 / 添加账号」按钮完成授权（支持连续登录多个账号）。</div>`;
    return;
  }
  let rows = '';
  for(const a of accs){
    const keys = Object.keys(a);
    let cells = '';
    for(const k of keys){
      let v = a[k];
      if(typeof v==='object') v = JSON.stringify(v);
      if(k==='status') v = statusBadge(v);
      cells += `<td class="k">${k}</td><td>${v ?? ''}</td>`;
    }
    rows += `<tr>${cells}</tr>`;
  }
  $('#accounts').innerHTML = `<table><tbody>${rows}</tbody></table>`;
}

function renderModels(m){
  const list = (m && m.data) ? m.data : [];
  if(list.length===0){
    $('#models').innerHTML = `<div class="empty">未拉到模型（可能尚未登录账号）。</div>`;
    return;
  }
  $('#models').innerHTML = list.map(x=>`<span class="pill">${x.id||x}</span>`).join('');
}

async function load(){
  const key = getKey();
  if(!key){
    $('#accounts').innerHTML = `<div class="err">未填写 api_key。请在右上角填入 config.json 里的 api_key 后点保存。</div>`;
    return;
  }
  try {
    const s = await getJSON('/status');
    let hz = null;
    try { hz = (await fetch('/healthz')).status; } catch(e){ hz = 'ERR'; }
    let m = {};
    try { m = await getJSON('/v1/models'); } catch(e){}
    renderCards(s, hz);
    renderAccounts(s);
    renderModels(m);
    loadSchedule();
    $('#raw').textContent = JSON.stringify(s, null, 2);
  } catch(e){
    $('#accounts').innerHTML = `<div class="err">请求失败：HTTP ${e.status||''} ${e.text||e.message||e}</div>`;
  }
}

function startAuto(){
  clearInterval(timer);
  if($('#auto').checked) timer = setInterval(load, 10000);
}

$('#saveKey').onclick = ()=>{ setKey($('#apikey').value.trim()); load(); };
$('#refresh').onclick = load;
$('#auto').onchange = startAuto;

// ---- 面板内登录（多账号）----
let pollTimer = null, pollState = '';
async function startLogin(){
  $('#loginBox').style.display = 'block';
  $('#loginStatus').textContent = '正在发起授权…';
  try {
    const r = await fetch('/api/login/start', {headers:authHeaders()});
    const d = await r.json();
    if(!r.ok) throw d;
    pollState = d.state;
    $('#loginUrl').href = d.auth_url;
    $('#loginUrl').textContent = d.auth_url;
    $('#loginStatus').textContent = '等待你在浏览器完成登录…（每 3 秒自动检测）';
    $('#loginBtn').disabled = true;
    clearInterval(pollTimer);
    pollTimer = setInterval(pollLogin, 3000);
  } catch(e){
    $('#loginStatus').innerHTML = `<span class="err">发起失败：${errText(e)}</span>`;
  }
}
async function pollLogin(){
  if(!pollState) return;
  try {
    const d = await getJSON('/api/login/poll?state='+encodeURIComponent(pollState));
    if(d.status === 'pending') return; // 用户还没完成登录，继续轮询
    clearInterval(pollTimer); pollTimer = null; pollState = '';
    $('#loginBtn').disabled = false;
    if(d.status === 'done'){
      $('#loginStatus').innerHTML = `✅ 登录成功：${(d.nickname&&d.nickname!=='')?d.nickname:'账号'}（uid=${d.uid}），凭证已保存并热加载，当前账号数 ${d.total_accounts}`;
      load();
    } else {
      $('#loginStatus').innerHTML = `<span class="err">❌ ${d.message||d.status}</span>`;
    }
  } catch(e){
    clearInterval(pollTimer); pollTimer = null; pollState = '';
    $('#loginBtn').disabled = false;
    $('#loginStatus').innerHTML = `<span class="err">轮询失败：${errText(e)}</span>`;
  }
}
$('#loginBtn').onclick = startLogin;

// ---- 每日签到 ----
async function loadSchedule(){
  try {
    const d = await getJSON('/api/schedule');
    const hrs = (d.checkin_hours||[]).map(h=>String(h).padStart(2,'0')+':00').join(' / ');
    $('#scheduleInfo').textContent = `自动签到：每天 ${hrs} ｜ 下次：${d.next_checkin_at}（${d.timezone}）`;
  } catch(e){
    $('#scheduleInfo').innerHTML = `<span class="err">调度信息加载失败：${errText(e)}</span>`;
  }
}
async function runCheckin(){
  const btn = $('#checkinBtn');
  btn.disabled = true; btn.textContent = '签到中…';
  $('#checkinResult').innerHTML = `<div class="muted">正在对所有账号执行签到（含余额刷新与解冻），请稍候…</div>`;
  try {
    const r = await fetch('/api/checkin', {method:'POST', headers:authHeaders()});
    const d = await r.json();
    if(!r.ok) throw d;
    const s = d.summary||{};
    const rows = (d.results||[]).map(x=>`<tr>
      <td class="k">uid</td><td>${(x.uid||'').replace(/</g,'&lt;')}</td>
      <td class="k">昵称</td><td>${(x.nickname||'-').replace(/</g,'&lt;')}</td>
      <td class="k">签到</td><td>${x.checkin||''}</td>
      <td class="k">余额</td><td>${x.remain>=0?x.remain:'-'}</td>
      <td class="k">详情</td><td class="muted">${(x.detail||'').replace(/</g,'&lt;')}</td>
    </tr>`).join('');
    $('#checkinResult').innerHTML = `<div class="muted">完成：成功 ${s.ok||0} ｜ 已签 ${s.already||0} ｜ 失败 ${s.fail||0} ｜ 跳过 ${s.skip||0}</div>
      <table style="margin-top:8px"><tbody>${rows}</tbody></table>`;
    load();
  } catch(e){
    $('#checkinResult').innerHTML = `<div class="err">签到失败：${errText(e)}</div>`;
  }
  btn.disabled = false; btn.textContent = '立即全量签到';
}
$('#checkinBtn').onclick = runCheckin;

setKey(getKey());
load();
loadSchedule();
startAuto();
</script>
</body>
</html>
